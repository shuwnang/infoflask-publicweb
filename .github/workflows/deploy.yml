# 官網部署：push 到 main → 建置 Next.js 靜態輸出 → 發佈到 GitHub Pages（自訂網域 infoflask.com 由 public/CNAME 提供）
name: Deploy infoflask.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 在 repo Settings → Secrets and variables → Actions → Variables 設定 NEXT_PUBLIC_FORM_ENDPOINT
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          # Crystal 工作台網址（設定後 /crystal/login/ 會直接 POST 到工作台登入；未設定＝入口頁）
          NEXT_PUBLIC_CRYSTAL_URL: ${{ vars.NEXT_PUBLIC_CRYSTAL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
